<style>
:root{--nv:#1b365d;--ink:#1f2a37;--acc:#0f5e73;--bg:#e6eaee;--line:#c5ced6;--warn:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:230px minmax(340px,1fr) minmax(420px,1.15fr);height:100vh}
#side,#formw,#pw{overflow:auto;height:100vh}
#side{background:var(--ink);color:#dfe7ee;padding:12px}
#side button{background:#33465a;color:#fff;border:0;border-radius:4px;padding:6px 8px;margin:0 4px 4px 0;cursor:pointer;font-size:12px}
#side button:hover{background:var(--acc)}
.sq{margin:14px 0 4px;font-weight:700;color:#fff}
#side a{display:block;padding:5px 8px;border-radius:4px;cursor:pointer;color:#c3d0dc}
#side a:hover{background:#2b3c4e}#side a.on{background:var(--acc);color:#fff}
#formw{padding:12px 14px}
#kb{position:sticky;top:-12px;z-index:5;background:var(--bg);padding:6px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#kb button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 8px;cursor:pointer}
#kb span{font-size:12px;color:#5b6b7a;margin-right:4px}
details{background:#fff;border:1px solid var(--line);border-radius:6px;margin:8px 0;padding:0 12px}
summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--acc)}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:8px}
label{display:block;font-weight:600;margin:0 0 8px;font-size:13px}
input,textarea,select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;margin-top:3px;background:#fff}
textarea{resize:vertical}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0 8px}
.ph{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;padding:8px;margin-bottom:8px;background:#f8fafb}
.ph .r{display:grid;grid-template-columns:64px 1fr 104px auto auto auto;gap:4px;margin-bottom:4px}
.ph .r input{margin:0}.ph textarea{margin:0 0 4px}
.ph button,.btn{border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;padding:4px 8px}
.ph button:hover,.btn:hover{background:#e3eef2}
#tot{font-weight:700}#tot.warn{color:var(--warn)}
.cc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
.cc label{font-weight:400;margin:0;display:flex;gap:5px;align-items:center}.cc input{width:auto;margin:0}
.th{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.th div{position:relative}.th img{height:60px;border:1px solid var(--line)}
.th [data-a=rmimg]{position:absolute;top:0;right:0;border:0;background:var(--warn);color:#fff;cursor:pointer;border-radius:0 0 0 4px}
#st{font-size:12px;color:#8fa3b5;margin-top:10px}
#pw{padding:18px}
#prev{background:#fff;width:794px;margin:0 auto;padding:44px 60px;zoom:var(--z,1);box-shadow:0 2px 10px #0003;font:10pt/1.4 Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#222;min-height:1000px}
#prev h1{font-size:22pt;color:var(--nv);margin:0 0 2pt}
#prev .sub{font-style:italic;color:#4a5a73;margin:0 0 14pt}
#prev .band{background:var(--nv);color:#fff;font-weight:700;font-size:8.5pt;padding:5px 9px;margin:10pt 0;text-transform:uppercase;letter-spacing:.3px}
#prev h2{color:var(--nv);font-size:12.5pt;margin:18pt 0 6pt}
#prev h3{color:#2b5c9e;font-size:10pt;margin:12pt 0 4pt}
#prev h4{color:var(--nv);font-size:10pt;margin:10pt 0 2pt}
#prev p{margin:0 0 4pt}#prev ul{margin:0 0 4pt;padding-left:16px}#prev li{margin:0 0 2pt}
#prev table{width:100%;border-collapse:collapse;margin:4pt 0 8pt}
#prev th,#prev td{border:1px solid var(--nv);padding:5px 8px;vertical-align:top}
#prev th{background:var(--nv);color:#fff;text-align:center}
#prev td.k{background:#eef2f8;color:var(--nv);font-weight:700;width:30%}
#prev .box{background:#eef2f8;padding:8px 12px;margin:4pt 0 8pt;border-radius:2px}
#prev .runh{text-align:right;font-size:8pt;color:#8a94a6;margin-bottom:12pt}
#prev .runf{text-align:center;font-size:8pt;color:#8a94a6;margin-top:22pt;border-top:1px solid #dde3ec;padding-top:6pt}
#prev h1.up{text-transform:uppercase;font-size:18pt}#prev li>p{margin:0}#prev .sb li>p:first-of-type{display:inline}#prev .sb{margin:0 0 10pt}.sq[data-qid]{cursor:pointer}.sq[data-qid]:hover{color:#4fb3c8}
#prev table.pg{margin:0}
#prev table.pg>thead>tr>td,#prev table.pg>tfoot>tr>td,#prev table.pg>tbody>tr>td{border:0;padding:0;background:none}
#prev table.pg>tbody>tr{break-inside:auto;page-break-inside:auto}
#prev tr,#prev img,#prev figure,#prev h2,#prev h3,#prev h4{break-inside:avoid;page-break-inside:avoid}
#prev h2,#prev h3,#prev h4{break-after:avoid}
#prev img{max-width:100%;display:block;margin:6pt auto}
@page{size:A4;margin:16mm}
@media(max-width:1100px){body{display:block;height:auto}#side,#formw,#pw{height:auto;overflow:visible}#prev{padding:20px}}
@media print{body{display:block;height:auto;background:#fff}#side,#formw,#vt{display:none}#pw{padding:0;overflow:visible;height:auto}#prev{box-shadow:none;width:auto;max-width:none;padding:0;min-height:0;zoom:1!important}#prev,#prev *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.bo{background:#eef4f6;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:10px}
#bl{max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 8px;margin:6px 0}
#bl label{font-weight:400;border-bottom:1px solid #eef1f3;padding:5px 0;margin:0}
#bl input{width:auto;margin:0 6px 0 0}#bl small{color:#5b6b7a}
.it{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid #eef1f3;padding:5px 0}.it small{color:#5b6b7a}
.it .btn{padding:2px 9px;font-weight:700;flex:none}
#bod>summary{border:0;margin:0;padding:6px 0}
.cb{display:grid;grid-template-columns:86px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.tr{background:#33465a;border-radius:3px;height:6px;display:block}.tr i{display:block;height:6px;background:#4fb3c8;border-radius:3px}
#side label{display:flex;gap:6px;font-size:12px;margin-top:12px;font-weight:400}#side label input{width:auto;margin:0}
#prev h3{clear:both}
#cr,#cl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
#cr[hidden],#cl[hidden]{display:none}#cr{background:#000c}#cr>div{background:#fff;padding:12px;border-radius:6px;max-width:96vw}
#crc{max-width:100%;cursor:crosshair;touch-action:none;display:block}
#cl{background:#0f1923;color:#fff;overflow:auto}.cw{width:min(1000px,94vw);text-align:center}
#cn{font-size:clamp(22px,4vw,44px);font-weight:700}
#ct{font-size:clamp(70px,16vw,200px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}#ct.low{color:#ffb020}#ct.out{color:#ff5a4d}
.bar{background:#33465a;height:10px;border-radius:5px;margin:10px 0}.bar i{display:block;height:100%;background:#4fb3c8;border-radius:5px}
#cc{text-align:left;font:clamp(16px,2.4vw,26px)/1.4 system-ui;max-height:30vh;overflow:auto;background:#1b2a38;border-radius:8px;padding:10px 16px;margin:10px 0}
#cx{opacity:.7}.cbt button{font-size:clamp(16px,2.4vw,26px);margin:4px;padding:10px 18px;border-radius:8px;border:0;background:#33465a;color:#fff;cursor:pointer}
#side,#formw,#pw{scroll-behavior:smooth}
body.noside{grid-template-columns:minmax(340px,1fr) minmax(420px,1.15fr)}body.noside #side{display:none}
body.noform{grid-template-columns:230px 1fr}body.noform #formw{display:none}
body.noside.noform{grid-template-columns:1fr}
#vt{position:fixed;left:8px;bottom:8px;z-index:30;display:flex;gap:4px}#vt button{border:0;background:#1f2a37cc;color:#fff;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:14px}
#dfl{max-height:200px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 8px;margin:6px 0 10px}
#dfl small{color:#5b6b7a}#dfl .btn{padding:2px 9px;font-weight:700;flex:none}
.ck{font-size:12px;margin:3px 0;color:#ffd27d}.ck.ok{color:#8fe0a8}
#prev li,#prev p{break-inside:avoid;page-break-inside:avoid;orphans:3;widows:3}
#side{padding-bottom:60px}#side a[draggable]{cursor:grab}#side a.ins-top{box-shadow:0 -3px 0 #4fb3c8}#side a.ins-bot{box-shadow:0 3px 0 #4fb3c8}#side a.dragging{opacity:.4}
#lf,#lvf{background:#2b3c4e;color:#fff;border:1px solid #3d5167;padding:5px 7px;font-size:12px}#lf::placeholder{color:#9db0c2}
</style>

<body>
<div id="side">
  <b>Mes fiches</b>
  <div style="margin-top:8px">
    <button data-a="newq">+ Séquence</button><button data-a="news">+ Séance</button>
    <button data-a="dup">Dupliquer</button><button data-a="dels">Suppr. séance</button>
    <button data-a="delq">Suppr. séquence</button><button data-a="dupq" title="Copier la séquence et toutes ses séances (réutilisation l’an prochain)">Dupliquer séquence</button><button data-a="mup" title="Monter la séance">↑</button><button data-a="mdn" title="Descendre la séance">↓</button>
  </div>
  <input id="lf" placeholder="🔎 Filtrer séquences et séances…" style="margin-top:10px"><select id="lvf" style="margin-top:4px"></select>
  <div id="list"></div><div id="bil"></div><div id="chk"></div>
  <label><input type="checkbox" id="short">Trame seule (sans analyse didactique)</label>
  <div style="margin-top:16px">
    <button data-a="expq" title="Fichier à partager avec un collègue">📤 Cette séquence</button><button data-a="exp">💾 Exporter tout</button><button data-a="imp">📂 Importer</button>
    <button data-a="seq">📋 Fiche séquence</button><button data-a="all">📑 Cahier complet</button><button data-a="chrono">⏱ Mode classe</button><button data-a="docx">📝 Exporter Word</button><button data-a="print">🖨️ Imprimer / PDF</button>
    <input type="file" id="impf" accept=".json" hidden>
  </div>
  <div id="st"></div>
</div>
<div id="formw"><div id="kb"></div><div id="form"></div></div>
<div id="pw"><div id="prev"></div></div>

<script defer src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
<div id="vt"><button data-a="vside" title="Masquer / afficher le volet de gauche">☰</button><button data-a="vform" title="Aperçu seul / formulaire + aperçu">👁</button></div>
<div id="cr" hidden><div><canvas id="crc"></canvas><p>Glissez sur l’image pour choisir la zone à garder.</p><button class="btn" id="cok">Recadrer</button> <button class="btn" id="cno">Annuler</button></div></div>
<div id="cl" hidden><div class="cw"><div id="cn"></div><div id="ct">00:00</div><div class="bar"><i id="cbar"></i></div><div id="cc"></div><div id="cx"></div>
<div class="cbt"><button data-c="prev">⏮</button><button data-c="play">⏯ Démarrer / pause</button><button data-c="next">⏭</button><button data-c="plus">+1 min</button><button data-c="close">✕ Quitter</button></div></div></div>
<script>
const KEY='cdm3',COMP=['Chercher','Modéliser','Représenter','Calculer','Raisonner','Communiquer'];
const TPL={
 'Questions rapides':[10,'Questions rapides','Série de questions rapides.','- Instaurer un rituel, faciliter la mise au travail.\n- Entraînement par petites touches.'],
 'Correction exercice':[5,'Correction de l’exercice du jour','','','c'],
 'Recherche individuelle':[10,'Recherche individuelle','Temps de travail individuel, silence.',''],
 'Mise en commun':[10,'Mise en commun en plénière','Correction collective.','','c'],
 'Production écrite':[20,'Phase de production écrite','Échanges entre voisins autorisés, production personnelle.','']};
const KB=[['a/b','$\\frac{}{}$'],['√','$\\sqrt{}$'],['x²','$x^{2}$'],['xⁿ','$x^{}$'],['π','$\\pi$'],['≤','$\\leq$'],['≥','$\\geq$'],['×','$\\times$'],['f(x)','$f(x)$'],['∈','$\\in$'],['ℝ','$\\mathbb{R}$']];
let db={seqs:[],seances:[],cur:null},last=null,t1,t2;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const S=()=>db.seances.find(x=>x.id===db.cur);
const Q=()=>db.seqs.find(x=>x.id===(S()||{}).seq);
const mk=a=>({duree:a[0],nom:a[1],contenu:a[2],comment:a[3],mode:a[4]||'a'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>');
function fmt(t){const B=[];
 for(const l of esc(t).split('\n')){const b=l.match(/^\s*[-•] (.*)/),s=l.trim(),p=B[B.length-1];
  if(!s){B.push(null);continue}
  if(!b&&p&&p.k!=='h'&&/^[a-zà-ÿ(,;]/.test(s)){p.x+=' '+s;continue}
  B.push(b?{k:'li',x:b[1]}:s.startsWith('## ')?{k:'h',x:s.slice(3)}:{k:'p',x:s})}
 let o='',ul=false;
 for(const x of B){if(x&&x.k==='li'){if(!ul){o+='<ul>';ul=true}o+='<li>'+inl(x.x)+'</li>';continue}
  if(ul){o+='</ul>';ul=false}if(x)o+=x.k==='h'?'<h4>'+inl(x.x)+'</h4>':'<p>'+inl(x.x)+'</p>'}
 return o+(ul?'</ul>':'')}

/* ---------- données ---------- */
function addSeance(qid){const n=db.seances.filter(x=>x.seq===qid).length+1;
 const s={id:uid(),seq:qid,numero:n,nom:'Nouvelle séance',date:'',duree:55,objectifs:'',prereq:'',tice:'',
  phases:[TPL['Questions rapides'],TPL['Recherche individuelle'],TPL['Mise en commun']].map(mk),
  objFin:'',travail:'',choixProbleme:'',imgs:[],difficultes:'',supp:'',comp:[],compTexte:'',choixTravail:''};
 db.seances.push(s);db.cur=s.id}
function addSeq(){const q={id:uid(),nom:'Nouvelle séquence',boRef:'',bo:'',capacites:''};db.seqs.push(q);addSeance(q.id)}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.seqs&&d.seances)db=d}catch(e){}
 if(!db.seqs.length)addSeq();if(!S())db.cur=db.seances[0].id}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));{const d=db.lastExport?Math.floor((Date.now()-db.lastExport)/864e5):null;const L='<u data-a="exp" style="cursor:pointer;color:#8fd3e6" title="Exporter toutes les fiches">exporter maintenant</u>';$('st').innerHTML='✓ Enregistré dans ce navigateur'+(d===null?(db.seances.length>=3?' · ⚠ jamais exporté : '+L:''):d>=7?' · ⚠ dernier export il y a '+d+' jours : '+L:' · dernier export il y a '+d+' j')}}
 catch(e){$('st').textContent='⚠ Stockage plein : exportez vos fiches (images lourdes ?)'}}
function changed(){total();list();clearTimeout(t1);t1=setTimeout(preview,120);clearTimeout(t2);t2=setTimeout(save,400)}

/* ---------- formulaire ---------- */
const fld=(sc,k,l,r,ph='')=>`<label>${l}${r?`<textarea rows="${r}" data-${sc}="${k}" placeholder="${ph}"></textarea>`:`<input data-${sc}="${k}" placeholder="${ph}">`}</label>`;
function build(){
 $('kb').innerHTML='<span>Formules :</span>'+KB.map((k,i)=>`<button data-a="kb" data-i="${i}">${k[0]}</button>`).join('')+'<span style="margin-left:8px">Texte :</span><button data-a="md" data-m="b" title="Gras (Ctrl+B)"><b>G</b></button><button data-a="md" data-m="u" title="Souligné (Ctrl+U)"><u>S</u></button><button data-a="md" data-m="l" title="Puce">• puce</button><button data-a="md" data-m="h" title="Sous-titre">## titre</button>';
 $('form').innerHTML=`
 <details open><summary>Séquence et Bulletin Officiel (commun à toutes ses séances)</summary><div id="bop"></div>
  ${fld('q','nom','Nom de la séquence',0,'Statistiques')}${fld('q','niveau','Niveau',0,'3ème, 2de, 1re…')}
  ${fld('q','boRef','Référence du B.O.',0,'B.O. du 22 janvier 2019')}
  ${fld('q','bo','Contenus du B.O.',5)}${fld('q','capacites','Capacités attendues',5)}${fld('q','cadre','Cadre général et progression pédagogique (fiche séquence)',6)}${fld('q','reco','Recommandations pédagogiques et différenciation (facultatif)',4)}</details>
 <details open><summary>Séance</summary>
  <div class="g"><label>N° de séance<input type="number" min="1" data-s="numero"></label>
  <label>Date<input type="date" data-s="date"></label>
  <label>Durée (min)<input type="number" min="1" data-s="duree"></label></div>
  ${fld('s','nom','Nom de la séance',0,'La place de la mairie')}<label>Type de séance<select data-s="type"><option value="">Apprentissage</option><option value="eval">Évaluation</option></select></label><label>État de préparation<select data-s="statut"><option value="">À préparer</option><option value="prete">Prête</option><option value="faite">Faite en classe</option></select></label>
  ${fld('s','objectifs','Objectif(s) de la séance',3)}
  ${fld('s','prereq','Pré-requis (connaissances, compétences)',4)}
  ${fld('s','tice','Pré-requis TICE',3,'Calculatrice, tableur, GeoGebra, Python…')}</details>
 <details open><summary>Déroulement envisagé</summary>
  <div id="ph"></div>
  <select id="tpl"><option value="">+ Ajouter une phase…</option>${Object.keys(TPL).map(k=>`<option>${k}</option>`).join('')}<option value="_">Phase vide</option></select>
  <p>Durée totale : <span id="tot"></span></p>
  ${fld('s','travail','Travail personnel donné (ligne du tableau)',3,'Exercice 7 pour le mardi 15 novembre…')}
  ${fld('s','objFin','Objectifs de fin de séance',3)}${fld('s','activiteTitre','Titre du focus sur l’activité',0,'Focus sur l’activité de découverte : « … »')}${fld('s','activite','Focus sur l’activité (énoncé, questions, corrections)',6)}${fld('s','trace','Contenu de la trace écrite (bilan à retenir)',6)}</details>
 <details open><summary>Analyse didactique</summary>
  ${fld('s','choixProbleme','Choix pédagogiques et didactiques sur le problème proposé',6)}
  <label>Énoncé / documents (images)<input type="file" id="imgf" accept="image/*"></label><div class="th" id="th"></div>
  <details id="dfd" class="bo"><summary>💡 Banque d’obstacles classiques (un clic pour ajouter)</summary><input id="dfs" placeholder="Rechercher : fraction, priorité, Thalès…" style="margin-bottom:6px"><select id="dft"></select><div id="dfl"></div></details>
  ${fld('s','difficultes','Difficultés potentielles rencontrées par les élèves',6)}
  ${fld('s','supp','Problème supplémentaire pour les élèves les plus rapides',4)}
  <b>Lien avec les compétences</b><div class="cc">${COMP.map(c=>`<label><input type="checkbox" data-c="${c}">${c}</label>`).join('')}</div>
  ${fld('s','compTexte','Justification du lien avec les compétences',3)}
  ${fld('s','choixTravail','Choix didactiques concernant le travail personnel',4)}</details>
 <details><summary>Fiche séquence : synthèse de cette séance</summary>
  <button class="btn" type="button" data-a="autosyn" style="margin-bottom:8px">⚙ Remplir depuis les phases</button>
  ${fld('s','introS','Introduction (tableau de synthèse)',2)}${fld('s','coursS','Moment de cours (tableau de synthèse)',2)}${fld('s','entrS','Entraînement & tâche (tableau de synthèse)',2)}
  ${fld('s','remLabel','Intitulé de la remarque',0,'Point de vigilance, Conseil d’animation, Posture de l’enseignant…')}${fld('s','rem','Remarque pédagogique (déroulé détaillé)',3)}</details>`}

function fill(){const s=S(),q=Q();s.imgs=(s.imgs||[]).map(x=>typeof x==='string'?{u:x,w:100,a:'c'}:x);
 document.querySelectorAll('[data-s]').forEach(e=>e.value=s[e.dataset.s]??'');
 document.querySelectorAll('[data-q]').forEach(e=>e.value=q[e.dataset.q]??'');
 document.querySelectorAll('[data-c]').forEach(e=>e.checked=s.comp.includes(e.dataset.c));
 phases();imgs()}
function phases(){const box=$('ph');box.innerHTML='';
 S().phases.forEach((p,i)=>{const d=document.createElement('div');d.className='ph';
