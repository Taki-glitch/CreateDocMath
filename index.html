<script>
const KEY='cdm3',COMP=['Chercher','Modéliser','Représenter','Calculer','Raisonner','Communiquer'];
const TPL={
 'Questions rapides':[10,'Questions rapides','Série de questions rapides.','- Instaurer un rituel, faciliter la mise au travail.\n- Entraînement par petites touches.'],
 'Correction exercice':[5,'Correction de l’exercice du jour','','','c'],
 'Recherche individuelle':[10,'Recherche individuelle','Temps de travail individuel, silence.',''],
 'Mise en commun':[10,'Mise en commun en plénière','Correction collective.','','c'],
 'Production écrite':[20,'Phase de production écrite','Échanges entre voisins autorisés, production personnelle.','']};
const KB=[['a/b','$\\frac{}{}$'],['√','$\\sqrt{}$'],['x²','$x^{2}$'],['xⁿ','$x^{}$'],['π','$\\pi$'],['≤','$\\leq$'],['≥','$\\geq$'],['×','$\\times$'],['f(x)','$f(x)$'],['∈','$\\in$'],['ℝ','$\\mathbb{R}$'],['système','$$\\begin{cases}{}\\\\ {}\\end{cases}$$'],['AB⃗','$\\vec{}$'],['ABĈ','$\\widehat{}$'],['30°','$30^\\circ$'],['[a ; b]','$[a\\,;\\,b]$']];
let db={seqs:[],seances:[],cur:null},last=null,t1,t2,t3;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const S=()=>db.seances.find(x=>x.id===db.cur);
const Q=()=>db.seqs.find(x=>x.id===(S()||{}).seq);
const mk=a=>({duree:a[0],nom:a[1],contenu:a[2],comment:a[3],mode:a[4]||'a'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>');
function fmt(t){const B=[];
 for(const l of esc(t).split('\n')){const b=l.match(/^\s*[-•] (.*)/),s=l.trim(),p=B[B.length-1];
  if(!s){B.push(null);continue}
  if(!b&&p&&p.k!=='h'&&/^[a-zà-ÿ(,;]/.test(s)){p.x+=' '+s;continue}
  B.push(b?{k:'li',x:b[1]}:s.startsWith('## ')?{k:'h',x:s.slice(3)}:{k:'p',x:s})}
 let o='',ul=false;
 for(const x of B){if(x&&x.k==='li'){if(!ul){o+='<ul>';ul=true}o+='<li>'+inl(x.x)+'</li>';continue}
  if(ul){o+='</ul>';ul=false}if(x)o+=x.k==='h'?'<h4>'+inl(x.x)+'</h4>':'<p>'+inl(x.x)+'</p>'}
 return o+(ul?'</ul>':'')}

/* ---------- données ---------- */
function addSeance(qid){const n=Math.max(0,...db.seances.filter(x=>x.seq===qid).map(x=>+x.numero||0))+1;
 const s={id:uid(),seq:qid,numero:n,nom:'Nouvelle séance',date:'',duree:55,objectifs:'',prereq:'',tice:'',
  phases:[TPL['Questions rapides'],TPL['Recherche individuelle'],TPL['Mise en commun']].map(mk),
  objFin:'',travail:'',choixProbleme:'',imgs:[],difficultes:'',supp:'',comp:[],compTexte:'',choixTravail:''};
 db.seances.push(s);db.cur=s.id}
function addSeq(){const q={id:uid(),nom:'Nouvelle séquence',boRef:'',bo:'',capacites:''};db.seqs.push(q);addSeance(q.id)}
/* ---------- stockage : IndexedDB (principal) ; l’ancienne clé localStorage « cdm3 » est conservée en secours ---------- */
/* Version du SCHÉMA DES DONNÉES (≠ version de l’application). v1 = ancien format localStorage sans champ v ; v2 = IndexedDB. */
const SCHEMA=2,LEGACY_KEY='cdm3',APP_V='2.0-b';
let STORE='idb',idbh=null,bc=null;
const TAB=uid();
const sv={dirty:false,busy:false,err:null,last:0,stale:false,rev:0,ver:0,ser:new Map(),blobs:new Set(),set:'',ord:'',t:0,mig:null,kc:new Map(),note:'',crash:false,legacyNewer:false,missing:0,persist:null};
const rq=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const tdone=t=>new Promise((ok,ko)=>{t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error||new Error('Transaction annulée'))});
const errMsg=e=>!e?'erreur inconnue':(e.name==='QuotaExceededError'||/quota|full/i.test(e.message||''))?'espace de stockage insuffisant sur cet appareil':(/Uncaught exception|Transaction annul/i.test(e.message||'')?'écriture refusée par le navigateur (espace insuffisant ?)':(e.message||e.name||String(e)));
const cj=x=>JSON.stringify(x,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((o,q)=>(o[q]=v[q],o),{}):v);
const fmtDT=t=>{try{return new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}catch(e){return String(t)}};
const fmtB=n=>n>=1e9?(n/1e9).toFixed(1)+' Go':n>=1e6?(n/1e6).toFixed(1)+' Mo':Math.max(1,Math.round(n/1e3))+' ko';
const p2=n=>String(n).padStart(2,'0');
const stamp=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())};
const lsRaw=()=>{try{return localStorage.getItem(LEGACY_KEY)}catch(e){return null}};
const lhash=raw=>h53(raw,0).toString(36)+'-'+raw.length;

/* --- hachages --- */
function h53(s,seed){let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)}
const SHA_K=(()=>{const k=[];let n=2;while(k.length<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p)k.push(Math.floor((Math.cbrt(n)%1)*4294967296));n++}return Uint32Array.from(k)})();
function sha256(u8){const H=Uint32Array.from([2,3,5,7,11,13,17,19].map(p=>Math.floor((Math.sqrt(p)%1)*4294967296))),l=u8.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(u8);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(nb-8,Math.floor(l/536870912));dv.setUint32(nb-4,(l<<3)>>>0);const w=new Uint32Array(64);
 for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10)))>>>0}
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+SHA_K[i]+w[i])>>>0,t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
  H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h}
 return[...H].map(x=>x.toString(16).padStart(8,'0')).join('')}

/* --- images : data URL ⇄ octets (stockage binaire, pas de Base64 dans IndexedDB) --- */
const isData=u=>typeof u==='string'&&/^data:[^,;]*;base64,/.test(u);
function d2b(u){const i=u.indexOf(','),m=/^data:([^;,]*)/.exec(u),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return{type:m&&m[1]||'image/jpeg',data:a}}
function b2d(type,buf){const a=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return'data:'+type+';base64,'+btoa(s)}
function blobKey(u){if(!isData(u)||u.length<1500)return null;let k=sv.kc.get(u);if(!k){k=u.length.toString(36)+'-'+h53(u,0).toString(36)+h53(u,7).toString(36);sv.kc.set(u,k)}return k}
function sameImg(a,b){if(a===b)return true;if(!isData(a)||!isData(b))return false;const x=d2b(a).data,y=d2b(b).data;if(x.length!==y.length)return false;for(let i=0;i<x.length;i++)if(x[i]!==y[i])return false;return true}

/* --- validation / normalisation / comparaison --- */
function validateDb(d){const E=[],W=[];
 if(!d||typeof d!=='object'||Array.isArray(d))return{E:['structure inattendue (objet attendu)'],W};
 if(!Array.isArray(d.seqs))E.push('liste des séquences absente ou invalide');
 if(!Array.isArray(d.seances))E.push('liste des séances absente ou invalide');
 if(E.length)return{E,W};
 const qi=new Set(),si=new Set();
 d.seqs.forEach((q,i)=>{if(!q||typeof q!=='object'||!q.id){E.push('séquence n°'+(i+1)+' sans identifiant');return}if(qi.has(q.id))E.push('identifiant de séquence en double : '+q.id);qi.add(q.id)});
 d.seances.forEach((s,i)=>{if(!s||typeof s!=='object'||!s.id){E.push('séance n°'+(i+1)+' sans identifiant');return}if(si.has(s.id))E.push('identifiant de séance en double : '+s.id);si.add(s.id);if(!qi.has(s.seq))W.push('séance « '+(s.nom||s.id)+' » rattachée à une séquence inconnue')});
 return{E,W}}
function normalizeDb(d){d.v=SCHEMA;if('models'in d&&!Array.isArray(d.models))d.models=[];
 d.seances.forEach(s=>{s.phases=(Array.isArray(s.phases)?s.phases:[]).filter(p=>p&&typeof p==='object');if(!Array.isArray(s.comp))s.comp=[];s.imgs=(Array.isArray(s.imgs)?s.imgs:[]).map(x=>typeof x==='string'?{u:x,w:100,a:'c',z:'c'}:x).filter(x=>x&&typeof x==='object')});
 if(!d.seances.some(s=>s.id===d.cur))d.cur=(d.seances[0]||{}).id||null;return d}
const countsOf=d=>({seqs:d.seqs.length,seances:d.seances.length,models:(d.models||[]).length,images:d.seances.reduce((a,s)=>a+(s.imgs||[]).filter(m=>m&&m.u).length,0)});
function diffDb(a,b){const D=[],ca=countsOf(a),cb=countsOf(b);for(const k in ca)if(ca[k]!==cb[k])D.push(k+' : '+ca[k]+' attendu(es), '+cb[k]+' trouvé(es)');
 const rest=d=>{const{seqs,seances,...r}=d;return cj(r)};if(rest(a)!==rest(b))D.push('paramètres différents');
 if(a.seqs.map(q=>q.id).join()!==b.seqs.map(q=>q.id).join())D.push('ordre ou liste des séquences différent');

const COVST={todo:'À traiter',wip:'En cours de traitement',done:'Traité',na:'Non pertinent pour cette séquence'};
const STOPW=new Set(['dans','pour','avec','sans','chez','sont','plus','entre','leur','leurs','cette','comme','faire','ainsi','dont','elle','elles','nous','vous','etre','avoir','tout','tous','toute','toutes','savoir','utiliser']);

const covKey=t=>h53(nmap(t).n.replace(/\s+/g,' ').trim(),3).toString(36);
function covLines(q){const seen=new Set(),L=[];[['bo','Contenu'],['capacites','Capacité']].forEach(([f,ty])=>String(q[f]||'').split('\n').forEach(l=>{const t=l.replace(/^\s*[-•]\s*/,'').trim();if(!t)return;const k=covKey(t);if(seen.has(k))return;seen.add(k);L.push({k,t,ty})}));return L}
function covReport(q){const L=covLines(q),ss=db.seances.filter(s=>s.seq===q.id).sort((a,b)=>a.numero-b.numero),cov=q.cov||{},keys=new Set(L.map(x=>x.k)),W=[],I=[];
 const rows=L.map(x=>{const l=ss.filter(s=>(s.couv||[]).includes(x.k)),st=cov[x.k]||'todo',t=shortT(x.t);
  if(!l.length&&st!=='na'&&st!=='done')W.push('« '+t+' » n’est travaillé dans aucune séance (statut : '+COVST[st]+').');
  if(!l.length&&st==='done')I.push('« '+t+' » est marqué « Traité » sans séance associée.');
  if(l.length>1)I.push('« '+t+' » apparaît dans '+l.length+' séances ('+l.map(s=>'S'+s.numero).join(', ')+').');
  if(l.length&&st!=='done'&&st!=='na'&&l.every(s=>s.statut==='faite'))I.push('« '+t+' » : toutes les séances liées sont faites ; pensez à le marquer « Traité ».');
  let sug=[];if(!l.length&&st!=='na'){const ws=nmap(x.t).n.split(/[^a-z0-9]+/).filter(w=>w.length>4&&!STOPW.has(w));if(ws.length)sug=ss.filter(s=>{const n=nmap([s.nom,s.objectifs,s.activite,...(s.phases||[]).map(p=>(p.nom||'')+' '+(p.contenu||''))].join(' ')).n;return ws.filter(w=>n.includes(w)).length>=Math.min(2,ws.length)}).map(s=>s.numero)}
  return{...x,l,st,sug}});
 if(L.length)ss.forEach(s=>{if(!(s.couv||[]).some(k=>keys.has(k)))W.push('Séance S'+s.numero+' : aucun contenu du B.O. associé.');const o=(s.couv||[]).filter(k=>!keys.has(k)).length;if(o)W.push('Séance S'+s.numero+' : '+o+' association(s) vers un contenu absent ou modifié.')});
 (q.compPrev||[]).forEach(c=>{if(!ss.some(s=>(s.comp||[]).includes(c)))W.push('Compétence « '+c+' » annoncée pour la séquence mais cochée dans aucune séance.')});
 ss.forEach(s=>{if((s.comp||[]).length&&!(s.compTexte||'').trim()&&!(s.activite||'').trim()&&!(s.phases||[]).some(p=>(p.contenu||'').trim()))W.push('Séance S'+s.numero+' : compétences cochées sans activité ni justification identifiable.')});
 return{rows,W,I,ss}}
