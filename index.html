<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiches de séance – Mathématiques</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
:root{--ink:#1f2a37;--acc:#0f5e73;--bg:#e6eaee;--line:#c5ced6;--warn:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:230px minmax(340px,1fr) minmax(420px,1.15fr);height:100vh}
#side,#formw,#pw{overflow:auto;height:100vh}
#side{background:var(--ink);color:#dfe7ee;padding:12px}
#side button{background:#33465a;color:#fff;border:0;border-radius:4px;padding:6px 8px;margin:0 4px 4px 0;cursor:pointer;font-size:12px}
#side button:hover{background:var(--acc)}
.sq{margin:14px 0 4px;font-weight:700;color:#fff}
#side a{display:block;padding:5px 8px;border-radius:4px;cursor:pointer;color:#c3d0dc}
#side a:hover{background:#2b3c4e}#side a.on{background:var(--acc);color:#fff}
#formw{padding:12px 14px}
#kb{position:sticky;top:-12px;z-index:5;background:var(--bg);padding:6px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#kb button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 8px;cursor:pointer}
#kb span{font-size:12px;color:#5b6b7a;margin-right:4px}
details{background:#fff;border:1px solid var(--line);border-radius:6px;margin:8px 0;padding:0 12px}
summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--acc)}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:8px}
label{display:block;font-weight:600;margin:0 0 8px;font-size:13px}
input,textarea,select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;margin-top:3px;background:#fff}
textarea{resize:vertical}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0 8px}
.ph{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;padding:8px;margin-bottom:8px;background:#f8fafb}
.ph .r{display:grid;grid-template-columns:64px 1fr 104px auto auto auto;gap:4px;margin-bottom:4px}
.ph .r input{margin:0}.ph textarea{margin:0 0 4px}
.ph button,.btn{border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;padding:4px 8px}
.ph button:hover,.btn:hover{background:#e3eef2}
#tot{font-weight:700}#tot.warn{color:var(--warn)}
.cc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
.cc label{font-weight:400;margin:0;display:flex;gap:5px;align-items:center}.cc input{width:auto;margin:0}
.th{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.th div{position:relative}.th img{height:60px;border:1px solid var(--line)}
.th button{position:absolute;top:0;right:0;border:0;background:var(--warn);color:#fff;cursor:pointer;border-radius:0 0 0 4px}
#st{font-size:12px;color:#8fa3b5;margin-top:10px}
#pw{padding:18px}
#prev{background:#fff;width:100%;max-width:794px;margin:0 auto;padding:44px 48px;box-shadow:0 2px 10px #0003;font:11pt/1.35 "Times New Roman",Times,serif;color:#000;min-height:1000px}
#prev h1{font-size:15pt;margin:0 0 6pt}
#prev h2{font-size:12.5pt;margin:12pt 0 4pt}
#prev h3{font-size:11.5pt;text-decoration:underline;margin:13pt 0 4pt}
#prev h4{font-size:11pt;font-style:italic;margin:9pt 0 2pt}
#prev p{margin:0 0 4pt;text-align:justify}#prev ul{margin:0 0 4pt;padding-left:20px}
#prev .c{text-align:center}
#prev table{width:100%;border-collapse:collapse;margin:4pt 0}
#prev th,#prev td{border:1px solid #000;padding:5px 7px;vertical-align:top}
#prev th{background:#eee}#prev td.w{width:25%;font-weight:700}
#prev tr,#prev img,#prev h3,#prev h4{break-inside:avoid;page-break-inside:avoid}
#prev h3,#prev h4{break-after:avoid}
#prev img{max-width:100%;display:block;margin:6pt auto}
@page{size:A4;margin:18mm 16mm}
@media(max-width:1100px){body{display:block;height:auto}#side,#formw,#pw{height:auto;overflow:visible}#prev{padding:20px}}
@media print{body{display:block;height:auto;background:#fff}#side,#formw{display:none}#pw{padding:0;overflow:visible;height:auto}#prev{box-shadow:none;max-width:none;padding:0;min-height:0}}

.bo{background:#eef4f6;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:10px}
#bl{max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 8px;margin:6px 0}
#bl label{font-weight:400;border-bottom:1px solid #eef1f3;padding:5px 0;margin:0}
#bl input{width:auto;margin:0 6px 0 0}#bl small{color:#5b6b7a}
.it{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid #eef1f3;padding:5px 0}.it small{color:#5b6b7a}
.it .btn{padding:2px 9px;font-weight:700;flex:none}
#bod>summary{border:0;margin:0;padding:6px 0}
.cb{display:grid;grid-template-columns:86px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.tr{background:#33465a;border-radius:3px;height:6px;display:block}.tr i{display:block;height:6px;background:#4fb3c8;border-radius:3px}
#side label{display:flex;gap:6px;font-size:12px;margin-top:12px;font-weight:400}#side label input{width:auto;margin:0}
#prev h3{clear:both}
</style>
</head>
<body>
<div id="side">
  <b>Mes fiches</b>
  <div style="margin-top:8px">
    <button data-a="newq">+ Séquence</button><button data-a="news">+ Séance</button>
    <button data-a="dup">Dupliquer</button><button data-a="dels">Suppr. séance</button>
    <button data-a="delq">Suppr. séquence</button>
  </div>
  <div id="list"></div><div id="bil"></div>
  <label><input type="checkbox" id="short">Trame seule (sans analyse didactique)</label>
  <div style="margin-top:16px">
    <button data-a="exp">💾 Exporter tout</button><button data-a="imp">📂 Importer</button>
    <button data-a="docx">📝 Exporter Word</button><button data-a="print">🖨️ Imprimer / PDF</button>
    <input type="file" id="impf" accept=".json" hidden>
  </div>
  <div id="st"></div>
</div>
<div id="formw"><div id="kb"></div><div id="form"></div></div>
<div id="pw"><div id="prev"></div></div>

<script src="bo_cycle3.js"></script>
<script src="bo_cycle4.js"></script>
<script src="bo_premiere.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
<script>
const KEY='cdm3',COMP=['Chercher','Modéliser','Représenter','Calculer','Raisonner','Communiquer'];
const TPL={
 'Questions rapides':[10,'Questions rapides','Série de questions rapides.','- Instaurer un rituel, faciliter la mise au travail.\n- Entraînement par petites touches.'],
 'Correction exercice':[5,'Correction de l’exercice du jour','','','c'],
 'Recherche individuelle':[10,'Recherche individuelle','Temps de travail individuel, silence.',''],
 'Mise en commun':[10,'Mise en commun en plénière','Correction collective.','','c'],
 'Production écrite':[20,'Phase de production écrite','Échanges entre voisins autorisés, production personnelle.','']};
const KB=[['a/b','$\\frac{}{}$'],['√','$\\sqrt{}$'],['x²','$x^{2}$'],['xⁿ','$x^{}$'],['π','$\\pi$'],['≤','$\\leq$'],['≥','$\\geq$'],['×','$\\times$'],['f(x)','$f(x)$'],['∈','$\\in$'],['ℝ','$\\mathbb{R}$']];
let db={seqs:[],seances:[],cur:null},last=null,t1,t2;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const S=()=>db.seances.find(x=>x.id===db.cur);
const Q=()=>db.seqs.find(x=>x.id===(S()||{}).seq);
const mk=a=>({duree:a[0],nom:a[1],contenu:a[2],comment:a[3],mode:a[4]||'a'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>');
function fmt(t){let o='',ul=false;for(const l of esc(t).split('\n')){const b=l.match(/^\s*[-•] (.*)/);
 if(b){if(!ul){o+='<ul>';ul=true}o+='<li>'+inl(b[1])+'</li>';continue}
 if(ul){o+='</ul>';ul=false}
 if(l.startsWith('## '))o+='<h4>'+inl(l.slice(3))+'</h4>';else if(l.trim())o+='<p>'+inl(l)+'</p>'}
 return o+(ul?'</ul>':'')}

/* ---------- données ---------- */
function addSeance(qid){const n=db.seances.filter(x=>x.seq===qid).length+1;
 const s={id:uid(),seq:qid,numero:n,nom:'Nouvelle séance',date:'',duree:55,objectifs:'',prereq:'',tice:'',
  phases:[TPL['Questions rapides'],TPL['Recherche individuelle'],TPL['Mise en commun']].map(mk),
  objFin:'',travail:'',choixProbleme:'',imgs:[],difficultes:'',supp:'',comp:[],compTexte:'',choixTravail:''};
 db.seances.push(s);db.cur=s.id}
function addSeq(){const q={id:uid(),nom:'Nouvelle séquence',boRef:'',bo:'',capacites:''};db.seqs.push(q);addSeance(q.id)}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.seqs&&d.seances)db=d}catch(e){}
 if(!db.seqs.length)addSeq();if(!S())db.cur=db.seances[0].id}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('st').textContent='✓ Enregistré dans ce navigateur'}
 catch(e){$('st').textContent='⚠ Stockage plein : exportez vos fiches (images lourdes ?)'}}
function changed(){total();list();clearTimeout(t1);t1=setTimeout(preview,120);clearTimeout(t2);t2=setTimeout(save,400)}

/* ---------- formulaire ---------- */
const fld=(sc,k,l,r,ph='')=>`<label>${l}${r?`<textarea rows="${r}" data-${sc}="${k}" placeholder="${ph}"></textarea>`:`<input data-${sc}="${k}" placeholder="${ph}">`}</label>`;
function build(){
 $('kb').innerHTML='<span>Formules :</span>'+KB.map((k,i)=>`<button data-a="kb" data-i="${i}">${k[0]}</button>`).join('')+'<span style="margin-left:8px">**gras** · __souligné__ · - puce · ## sous-titre</span>';
 $('form').innerHTML=`
 <details open><summary>Séquence et Bulletin Officiel (commun à toutes ses séances)</summary><div id="bop"></div>
  ${fld('q','nom','Nom de la séquence',0,'Séquence 3 : Généralités sur les fonctions')}
  ${fld('q','boRef','Référence du B.O.',0,'B.O. du 22 janvier 2019')}
  ${fld('q','bo','Contenus du B.O.',5)}${fld('q','capacites','Capacités attendues',5)}</details>
 <details open><summary>Séance</summary>
  <div class="g"><label>N° de séance<input type="number" min="1" data-s="numero"></label>
  <label>Date<input type="date" data-s="date"></label>
  <label>Durée (min)<input type="number" min="1" data-s="duree"></label></div>
  ${fld('s','nom','Nom de la séance',0,'La place de la mairie')}
  ${fld('s','objectifs','Objectif(s) de la séance',3)}
  ${fld('s','prereq','Pré-requis (connaissances, compétences)',4)}
  ${fld('s','tice','Pré-requis TICE',3,'Calculatrice, tableur, GeoGebra, Python…')}</details>
 <details open><summary>Déroulement envisagé</summary>
  <div id="ph"></div>
  <select id="tpl"><option value="">+ Ajouter une phase…</option>${Object.keys(TPL).map(k=>`<option>${k}</option>`).join('')}<option value="_">Phase vide</option></select>
  <p>Durée totale : <span id="tot"></span></p>
  ${fld('s','travail','Travail personnel donné (ligne du tableau)',3,'Exercice 7 pour le mardi 15 novembre…')}
  ${fld('s','objFin','Objectifs de fin de séance',3)}</details>
 <details open><summary>Analyse didactique</summary>
  ${fld('s','choixProbleme','Choix pédagogiques et didactiques sur le problème proposé',6)}
  <label>Énoncé / documents (images)<input type="file" id="imgf" accept="image/*"></label><div class="th" id="th"></div>
  ${fld('s','difficultes','Difficultés potentielles rencontrées par les élèves',6)}
  ${fld('s','supp','Problème supplémentaire pour les élèves les plus rapides',4)}
  <b>Lien avec les compétences</b><div class="cc">${COMP.map(c=>`<label><input type="checkbox" data-c="${c}">${c}</label>`).join('')}</div>
  ${fld('s','compTexte','Justification du lien avec les compétences',3)}
  ${fld('s','choixTravail','Choix didactiques concernant le travail personnel',4)}</details>`}

function fill(){const s=S(),q=Q();s.imgs=(s.imgs||[]).map(x=>typeof x==='string'?{u:x,w:100,a:'c'}:x);
 document.querySelectorAll('[data-s]').forEach(e=>e.value=s[e.dataset.s]??'');
 document.querySelectorAll('[data-q]').forEach(e=>e.value=q[e.dataset.q]??'');
 document.querySelectorAll('[data-c]').forEach(e=>e.checked=s.comp.includes(e.dataset.c));
 phases();imgs()}
function phases(){const box=$('ph');box.innerHTML='';
 S().phases.forEach((p,i)=>{const d=document.createElement('div');d.className='ph';
  d.innerHTML=`<div class="r"><input type="number" min="0" data-i="${i}" data-f="duree" placeholder="min"><input data-i="${i}" data-f="nom" placeholder="Nom de la phase"><select data-i="${i}" data-f="mode" title="Qui est actif ?"><option value="a">Élèves actifs</option><option value="c">Collectif</option></select><button data-a="up" data-i="${i}" title="Monter">↑</button><button data-a="dn" data-i="${i}" title="Descendre">↓</button><button data-a="rm" data-i="${i}" title="Supprimer">✕</button></div><textarea rows="3" data-i="${i}" data-f="contenu" placeholder="Mise en œuvre en classe"></textarea><textarea rows="4" data-i="${i}" data-f="comment" placeholder="Commentaires sur cette phase (objectifs, difficultés…)"></textarea>`;
  d.querySelectorAll('[data-f]').forEach(e=>e.value=p[e.dataset.f]??(e.dataset.f==='mode'?'a':''));box.append(d)});total()}
function total(){const s=S(),t=s.phases.reduce((a,p)=>a+(+p.duree||0),0),e=$('tot');
 const ac=s.phases.reduce((a,p)=>a+(p.mode==='c'?0:+p.duree||0),0);
 e.textContent=t+' min sur '+(s.duree||'?')+' min'+(s.duree&&t>s.duree?' ⚠ dépasse la durée de la séance':'')+(t?' · élèves actifs : '+ac+' min ('+Math.round(100*ac/t)+' %) · collectif : '+(t-ac)+' min':'');
 e.className=s.duree&&t>s.duree?'warn':''}
function imgs(){$('th').innerHTML=S().imgs.map((m,i)=>`<div style="border:1px solid var(--line);padding:4px;background:#fff"><img src="${m.u}" alt=""><button data-a="rmimg" data-i="${i}">✕</button><br><select data-j="${i}" data-p="w" style="width:auto"><option value="25">25 %</option><option value="50">50 %</option><option value="75">75 %</option><option value="100">100 %</option></select> <select data-j="${i}" data-p="a" style="width:auto"><option value="c">Centrée</option><option value="r">À droite</option></select></div>`).join('');
 document.querySelectorAll('#th [data-j]').forEach(e=>e.value=S().imgs[+e.dataset.j][e.dataset.p])}
function addImg(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);S().imgs.push({u:c.toDataURL('image/jpeg',.8),w:100,a:'c'});imgs();changed()};im.src=r.result};r.readAsDataURL(f)}
function ins(str){const e=last;if(!e)return;const a=e.selectionStart;e.setRangeText(str,a,e.selectionEnd,'end');
 const k=str.indexOf('{}');if(k>=0)e.selectionStart=e.selectionEnd=a+k+1;e.focus();e.dispatchEvent(new Event('input',{bubbles:true}))}

/* ---------- liste ---------- */
function bilan(){const q=Q();if(!q)return;const ss=db.seances.filter(x=>x.seq===q.id);
 $('bil').innerHTML='<div class="sq">Compétences de la séquence</div>'+COMP.map(c=>{const n=ss.filter(x=>(x.comp||[]).includes(c)).length;
  return `<div class="cb"><span>${c}</span><span class="tr"><i style="width:${ss.length?100*n/ss.length:0}%"></i></span><b>${n}/${ss.length}</b></div>`}).join('')}
function list(){bilan();$('list').innerHTML=db.seqs.map(q=>`<div class="sq">${esc(q.nom)||'(sans nom)'}</div>`+
 db.seances.filter(s=>s.seq===q.id).sort((a,b)=>a.numero-b.numero).map(s=>`<a data-id="${s.id}" class="${s.id===db.cur?'on':''}">S${esc(s.numero)} – ${esc(s.nom)||'(sans nom)'}</a>`).join('')).join('')}
function show(){fill();list();preview();save();$('short').checked=!!db.short;bodState()}

/* ---------- aperçu = document final ---------- */
function preview(){const s=S(),q=Q();if(!s)return;const A=!db.short;
 const dt=s.date?new Date(s.date+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
 const sec=(t,c)=>(c||'').trim()?`<h3>${t}</h3>${fmt(c)}`:'';
 const tr=(l,c)=>(c||'').trim()?`<tr><td class="w">${l}</td><td>${fmt(c)}</td></tr>`:'';
 const T=s.phases.reduce((a,p)=>a+(+p.duree||0),0);
 const rows=s.phases.map(p=>`<tr><td class="w">${esc(p.duree)} min</td><td><b>${esc(p.nom)}</b>${fmt(p.contenu)}</td></tr>`).join('')+tr('Travail personnel',s.travail)+tr('Objectifs de fin de séance',s.objFin);
 const cm=s.phases.filter(p=>(p.comment||'').trim()).map(p=>`<h4>${esc(p.nom)}</h4>${fmt(p.comment)}`).join('');
 const comps=s.comp.length?`<p><b>${COMP.filter(c=>s.comp.includes(c)).join(', ')}</b></p>`:'';
 $('prev').innerHTML=`<h1>${esc(q.nom)}</h1>${q.boRef?`<p><b>${esc(q.boRef)}</b></p>`:''}
 ${(q.bo+q.capacites).trim()?`<table><tr><th>Contenus</th><th>Capacités attendues</th></tr><tr><td>${fmt(q.bo)}</td><td>${fmt(q.capacites)}</td></tr></table>`:''}
 <h2>Séance ${esc(s.numero)} de la séquence${dt?' : '+esc(dt):''}</h2>${s.nom?`<p><b>${esc(s.nom)}</b></p>`:''}
 ${sec('Objectif de la séance :',s.objectifs)}${sec('Pré-requis :',s.prereq)}${sec('Pré-requis TICE :',s.tice)}
 ${rows?`<h3>Déroulement envisagé (${T} min) :</h3><table><tr><th>Minutage envisagé</th><th>Mise en œuvre en classe</th></tr>${rows}</table>`:''}
 ${cm&&A?`<h3>Commentaires sur chaque phase de la séance :</h3>${cm}`:''}
 ${A&&(s.choixProbleme.trim()||s.imgs.length)?`<h3>Choix pédagogiques et didactiques concernant le problème proposé :</h3>${s.imgs.map(m=>`<img src="${m.u}" alt="" style="width:${m.w}%;${m.a==='r'?'float:right;margin:0 0 6pt 10pt':'display:block;margin:6pt auto'}">`).join('')}${fmt(s.choixProbleme)}`:''}
 ${A?sec('Difficultés potentielles rencontrées par les élèves :',s.difficultes):''}${sec('Problème supplémentaire pour les élèves les plus rapides :',s.supp)}
 ${A&&(comps||s.compTexte.trim())?`<h3>Lien avec les compétences :</h3>${comps}${fmt(s.compTexte)}`:''}
 ${A?sec('Choix didactique concernant le travail personnel :',s.choixTravail):''}`;
 if(window.renderMathInElement)renderMathInElement($('prev'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}

/* ---------- événements ---------- */
$('form').addEventListener('input',e=>{const t=e.target,s=S();
 if(t.dataset.s)s[t.dataset.s]=t.value;
 else if(t.dataset.q)Q()[t.dataset.q]=t.value;
 else if(t.dataset.f)s.phases[+t.dataset.i][t.dataset.f]=t.value;
 else if(t.dataset.j!==undefined)s.imgs[+t.dataset.j][t.dataset.p]=t.value;
 else if(t.dataset.c)s.comp=[...document.querySelectorAll('[data-c]:checked')].map(x=>x.dataset.c);
 else return;changed()});
$('form').addEventListener('focusin',e=>{if(e.target.matches('textarea,input:not([type=number]):not([type=date]):not([type=checkbox]):not([type=file])'))last=e.target});
$('form').addEventListener('change',e=>{if(e.target.id==='tpl'){const v=e.target.value;if(v){S().phases.push(mk(v==='_'?[10,'','','']:TPL[v]));phases();changed()}e.target.value=''}
 if(e.target.id==='imgf'){addImg(e.target.files[0]);e.target.value=''}});
$('kb').addEventListener('mousedown',e=>e.preventDefault());
$('list').addEventListener('click',e=>{const a=e.target.closest('a');if(a){db.cur=a.dataset.id;show()}});
$('impf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.seqs)||!Array.isArray(d.seances)||!d.seances.length)throw 0;
  if(!confirm('Remplacer toutes vos fiches actuelles par celles du fichier ?'))return;db=d;if(!S())db.cur=db.seances[0].id;show()}
  catch(x){alert('Fichier invalide : choisissez un export JSON de cette application.')}};r.readAsText(f);e.target.value=''});
const imgOf=dt=>[...(dt.files||[])].find(f=>f.type.startsWith('image/'));
$('formw').addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});
$('formw').addEventListener('drop',e=>{const f=imgOf(e.dataTransfer);if(f){e.preventDefault();addImg(f)}});
document.addEventListener('paste',e=>{const f=e.clipboardData&&imgOf(e.clipboardData);if(f){e.preventDefault();addImg(f)}});
$('short').addEventListener('change',e=>{db.short=e.target.checked;preview();save()});
function exportDocx(){if(!window.htmlDocx){alert('Bibliothèque Word non chargée (connexion Internet requise).');return}
 const c=$('prev').cloneNode(true);
 c.querySelectorAll('.katex').forEach(k=>{const t=k.querySelector('annotation');k.replaceWith(document.createTextNode(t?'$'+t.textContent+'$':k.textContent))});
 const css='body{font-family:"Times New Roman";font-size:11pt}table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:4px;vertical-align:top}th{background:#eee}h3{text-decoration:underline;font-size:12pt}h4{font-style:italic}';
 const blob=htmlDocx.asBlob('<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+c.innerHTML+'</body></html>',{margins:{top:1000,right:900,bottom:1000,left:900}});
 const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=(Q().nom+' - S'+S().numero).replace(/[\/:*?"<>|]/g,'')+'.docx';l.click();URL.revokeObjectURL(l.href)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,s=S();
 if(a==='kb')ins(KB[i][1]);
 else if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1;if(j>=0&&j<s.phases.length){[s.phases[i],s.phases[j]]=[s.phases[j],s.phases[i]];phases();changed()}}
 else if(a==='rm'){s.phases.splice(i,1);phases();changed()}
 else if(a==='rmimg'){s.imgs.splice(i,1);imgs();changed()}
 else if(a==='newq'){addSeq();show()}
 else if(a==='news'){addSeance(s.seq);show()}
 else if(a==='dup'){const c=JSON.parse(JSON.stringify(s));c.id=uid();c.nom+=' (copie)';c.numero=db.seances.filter(x=>x.seq===s.seq).length+1;db.seances.push(c);db.cur=c.id;show()}
 else if(a==='dels'){if(confirm('Supprimer la séance « '+s.nom+' » ?')){db.seances=db.seances.filter(x=>x.id!==s.id);
   if(!db.seances.some(x=>x.seq===s.seq))db.seqs=db.seqs.filter(x=>x.id!==s.seq);
   if(!db.seqs.length)addSeq();else db.cur=db.seances[0].id;show()}}
 else if(a==='delq'){if(confirm('Supprimer la séquence « '+Q().nom+' » et toutes ses séances ?')){const id=s.seq;db.seances=db.seances.filter(x=>x.seq!==id);db.seqs=db.seqs.filter(x=>x.id!==id);
   if(!db.seqs.length)addSeq();else db.cur=db.seances[0].id;show()}}
 else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
   l.download='fiches_maths_'+new Date().toISOString().slice(0,10)+'.json';l.click();URL.revokeObjectURL(l.href)}
 else if(a==='imp')$('impf').click();
 else if(a==='docx')exportDocx();
 else if(a==='print'){document.title=(Q().nom+' - S'+s.numero).slice(0,80);window.print()}});


/* ---------- sélecteur de BO (multi-fichiers : chaque bo_*.js ajoute ses lignes à BO_DATA) ---------- */
const KL={c:'Contenus',o:'Objectifs / capacités',a:'Automatismes',e:'Attendus de fin d’année'},KS={c:'contenu',o:'capacité',a:'automatisme',e:'attendu'};
const NIV=['6e','5e','4e','3e','2de','1re'];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uniq=a=>[...new Set(a)];
function bodState(){const d=$('bod'),q=Q();if(d&&q)d.open=!((q.bo||'')+(q.capacites||'')).trim()}
function boInit(){
 if(typeof BO_DATA==='undefined'){$('bop').innerHTML='<p>⚠ Aucun fichier BO trouvé (bo_cycle3.js, bo_cycle4.js, bo_premiere.js) : placez-les à côté de index.html.</p>';return}
 const nv=uniq(BO_DATA.map(x=>x[0])).sort((a,b)=>NIV.findIndex(n=>a.startsWith(n))-NIV.findIndex(n=>b.startsWith(n)));
 $('bop').innerHTML=`<details id="bod" class="bo"><summary>🔎 Chercher dans le programme (un clic sur + ajoute la ligne au BO)</summary>
  <div class="g"><label>Niveau<select id="bn"><option value="">Tous</option>${nv.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label>
  <label>Domaine<select id="bd"></select></label><label>Thème<select id="bt"></select></label></div>
  <input id="bs" placeholder="Mot-clé : fractions égales, Pythagore, suites…">
  <div class="cc" style="margin-top:6px">${Object.entries(KL).map(([k,v])=>`<label><input type="checkbox" data-k="${k}" checked>${v}</label>`).join('')}</div>
  <div id="bl"></div><small id="bc"></small></details>`;
 boOpts();boList();bodState();const b=$('bop');
 b.addEventListener('change',e=>{const t=e.target;if(t.id==='bs')return;if(t.id==='bn'||t.id==='bd')boOpts();boList()});
 b.addEventListener('input',e=>{if(e.target.id==='bs')boList()});
 b.addEventListener('click',e=>{const x=e.target.closest('[data-add]');if(x)boAdd(+x.dataset.add)})}
function setOpts(id,arr){const e=$(id),v=e.value;e.innerHTML='<option value="">Tous</option>'+arr.map(a=>`<option>${esc(a)}</option>`).join('');if(arr.includes(v))e.value=v}
function boOpts(){const n=$('bn').value,it=BO_DATA.filter(x=>!n||x[0]===n);
 setOpts('bd',uniq(it.map(x=>x[1])));const d=$('bd').value;setOpts('bt',uniq(it.filter(x=>!d||x[1]===d).map(x=>x[2])))}
function boList(){const n=$('bn').value,d=$('bd').value,t=$('bt').value,w=norm($('bs').value).split(/\s+/).filter(Boolean),
 ks=[...document.querySelectorAll('[data-k]:checked')].map(e=>e.dataset.k);
 const r=BO_DATA.map((x,i)=>[x,i]).filter(([x])=>(!n||x[0]===n)&&(!d||x[1]===d)&&(!t||x[2]===t)&&ks.includes(x[3])&&w.every(m=>norm(x[2]+' '+x[4]).includes(m)));
 $('bl').innerHTML=r.slice(0,60).map(([x,i])=>`<div class="it"><button class="btn" data-add="${i}" title="Ajouter au BO">+</button><div><small>${esc(x[0])} · ${esc(x[2])} · ${KS[x[3]]}</small><br>${esc(x[4]).replace(/\n/g,'<br>')}</div></div>`).join('')||'<p><i>Aucun résultat.</i></p>';
 $('bc').textContent=r.length>60?r.length+' résultats (60 affichés) : affinez la recherche':r.length+' résultat(s)'}
function boAdd(i){const q=Q(),x=BO_DATA[i];if(!q)return;
 const add=(c,l)=>c.split('\n').includes(l)?c:(c.trim()?c.replace(/\s+$/,'')+'\n':'')+l;
 const pre={a:'Automatisme : ',e:'Attendu de fin d’année : '}[x[3]]||'';
 if(x[3]==='c')q.bo=add(q.bo,'- '+x[4]);else{q.bo=add(q.bo,'- '+x[0]+' · '+x[2]);q.capacites=add(q.capacites,'- '+pre+x[4])}
 if(!q.boRef.trim())q.boRef=/^6e/.test(x[0])?'Programme de mathématiques du cycle 3':/^1re/.test(x[0])?'Programme de mathématiques intégré à l’enseignement scientifique – 1re générale':'Programme de mathématiques du cycle 4 (annexe 2)';
 ['bo','capacites','boRef'].forEach(k=>document.querySelector('[data-q="'+k+'"]').value=q[k]);
 const bt=document.querySelector('[data-add="'+i+'"]');if(bt)bt.textContent='✓';changed()}

load();build();show();boInit();
window.addEventListener('load',preview);
</script>
